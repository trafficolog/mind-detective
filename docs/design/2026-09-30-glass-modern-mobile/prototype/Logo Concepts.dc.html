<div style="min-height:100vh;background:radial-gradient(circle at 80% 4%,rgba(141,194,255,.34),transparent 30%),radial-gradient(circle at 10% 70%,rgba(198,223,255,.3),transparent 36%),linear-gradient(180deg,#F7FBFF 0%,#EAF5FF 100%);font-family:Inter,'SF Pro Text',system-ui,sans-serif;color:#0B1733;padding:48px;box-sizing:border-box">
<div style="display:grid;gap:64px">
<sc-for list="{{ rounds }}" as="r" hint-placeholder-count="2">
<section data-screen-label="{{ r.label }}" style="display:grid;gap:24px">
<div style="display:grid;gap:8px;max-width:760px">
<span style="font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:650;color:#0B86EA">{{ r.label }}</span>
<h1 style="margin:0;font-size:40px;line-height:44px;font-weight:700;letter-spacing:-0.02em">{{ r.title }}</h1>
<p style="margin:0;font-size:17px;line-height:26px;color:#587196;text-wrap:pretty">{{ r.lede }}</p>
</div>
<div style="display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<sc-for list="{{ r.opts }}" as="o" hint-placeholder-count="6">
<div id="{{ o.id }}" style="width:540px;display:grid;gap:16px;padding:20px;border-radius:24px;background:rgba(255,255,255,.52);border:1px solid rgba(255,255,255,.75);box-shadow:0 18px 40px rgba(69,118,171,.14),inset 0 1px 0 rgba(255,255,255,.9);backdrop-filter:blur(22px) saturate(135%);box-sizing:border-box">
<div style="display:flex;align-items:center;gap:10px">
<span style="padding:3px 10px;border-radius:999px;background:#0B1733;color:#FFFFFF;font-size:13px;font-weight:700">{{ o.id }}</span>
<strong style="font-size:19px;line-height:24px;font-weight:650">{{ o.name }}</strong>
</div>
<span style="font-size:15px;line-height:22px;color:#587196;text-wrap:pretty">{{ o.why }}</span>
<div style="display:grid;grid-template-columns:200px 1fr;gap:12px">
<div style="height:200px;border-radius:20px;background:#FFFFFF;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 100 100" width="140" height="140" role="img" aria-label="{{ o.name }}"><use href="{{ o.href }}"></use></svg></div>
<div style="display:grid;grid-template-rows:1fr 1fr;gap:12px">
<div style="border-radius:20px;background:linear-gradient(160deg,rgba(255,255,255,.9),rgba(227,241,255,.7));border:1px solid rgba(255,255,255,.8);display:flex;align-items:center;justify-content:center;gap:18px">
<div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(160deg,#FFFFFF 0%,#E3F1FF 100%);box-shadow:0 8px 20px rgba(69,118,171,.22),inset 0 1px 0 #fff;display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 100 100" width="50" height="50"><use href="{{ o.href }}"></use></svg></div>
<div style="width:72px;height:72px;border-radius:18px;background:linear-gradient(160deg,#4AAEFF 0%,#0B86EA 55%,#005CFC 100%);box-shadow:0 8px 20px rgba(11,134,234,.3);display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 100 100" width="50" height="50" style="--a:#FFFFFF;--h:#9FD3FF;--n:#0B86EA"><use href="{{ o.href }}"></use></svg></div>
</div>
<div style="border-radius:20px;background:#0B1733;display:flex;align-items:center;justify-content:center;gap:16px">
<svg viewBox="0 0 100 100" width="44" height="44" style="--a:#FFFFFF;--h:#5B7BA6;--n:#0B1733"><use href="{{ o.href }}"></use></svg>
<svg viewBox="0 0 100 100" width="24" height="24" style="--a:#FFFFFF;--h:#5B7BA6;--n:#0B1733"><use href="{{ o.href }}"></use></svg>
<svg viewBox="0 0 100 100" width="16" height="16" style="--a:#FFFFFF;--h:#5B7BA6;--n:#0B1733"><use href="{{ o.href }}"></use></svg>
</div>
</div>
</div>
<div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 16px;border-radius:18px;background:#FFFFFF">
<div style="display:flex;align-items:center;gap:10px"><svg viewBox="0 0 100 100" width="40" height="40"><use href="{{ o.href }}"></use></svg><span style="font-size:22px;line-height:26px;letter-spacing:-0.01em"><span style="font-weight:800;color:#01123A">Mind</span> <span style="font-weight:500;color:#01123A">Detective</span></span></div>
<div style="display:flex;align-items:center;gap:8px"><svg viewBox="0 0 100 100" width="24" height="24"><use href="{{ o.href }}"></use></svg><svg viewBox="0 0 100 100" width="16" height="16"><use href="{{ o.href }}"></use></svg></div>
</div>
</div>

</div>
</section>
</sc-for>
</div>
</div>

<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() {
    const r1 = [
        { id: '1a', href: '#c1', name: 'Линза-путь', why: 'Внутри лупы — временная линия с узлами. Одним знаком передаёт оба режима: реконструкцию и поиск.' },
        { id: '1b', href: '#c2', name: 'Фрагменты', why: 'Кольцо лупы собрано из четырёх фрагментов вокруг точки. Отсылка к слогану «Превращаем фрагменты в проверяемый контекст».' },
        { id: '1c', href: '#c3', name: 'Проверено', why: 'Лупа с галочкой: акцент на физических проверках и журнале. Самый простой и читаемый в размере 16 px.' },
        { id: '1d', href: '#c4', name: 'М-маршрут', why: 'Монограмма M нарисована как маршрут и переходит в лупу. Это самый «буквенный» вариант.' },
        { id: '1e', href: '#c5', name: 'Сфера', why: 'Стеклянная сфера с бликом и орбитой продолжает иллюстрацию заставки. Мягкий, без явной лупы.' },
        { id: '1f', href: '#c6', name: 'Нить', why: 'Пунктирная нить приводит в лупу с точкой в центре: не потерять нить поиска.' },
      ];
    const r2 = [
      { id: '2a', href: '#c7', name: 'Негатив', why: 'Лупа вырезана из градиентного скруглённого квадрата. Знак уже готов как иконка приложения и лучше всех держит 16 px.' },
      { id: '2b', href: '#c8', name: 'Память и лупа', why: 'Слева две дуги памяти, справа лупа: «вспомнить» и «проверить» в одном знаке, без буквального мозга.' },
      { id: '2c', href: '#c9', name: 'Круги поиска', why: 'Прерывистые кольца сужаются к точке. Систематический поиск от широкой зоны к конкретному месту.' },
      { id: '2d', href: '#c10', name: 'Шаги к проверке', why: 'Два подтверждённых шага на линии и лупа в конце: сначала последовательность, затем физическая проверка.' },
      { id: '2e', href: '#c11', name: 'Монограмма md', why: 'Строчные m и d, у d чаша стала линзой. Типографский вариант для связки со словесным знаком.' },
      { id: '2f', href: '#c12', name: 'Найденный фрагмент', why: 'В кольце лупы заполнен один сектор: часть контекста подтверждена, остальное честно остаётся открытым.' },
    ];
    const r3 = [
      { id: '3a', href: '#c13', name: 'Узелок на память', why: 'Одна непрерывная нить завязана петлёй, как узелок на память. Знак про то, чтобы удержать контекст, без лупы и без «детективности».' },
      { id: '3b', href: '#c14', name: 'Дословно', why: 'Кавычки « и точка: рассказ сохраняется слово в слово, а подтверждённое отмечено отдельно.' },
      { id: '3c', href: '#c15', name: 'Вернуться по следу', why: 'Дуга возвращается к исходной точке: пройти свои шаги заново, спокойно и по порядку.' },
      { id: '3d', href: '#c16', name: 'Мозаика состояний', why: 'Три заполненных фрагмента и один пунктирный. Неизвестное видно и допустимо, его не дорисовывают.' },
      { id: '3e', href: '#c17', name: 'Ясность', why: 'Восход над линией горизонта: из хаоса поиска к спокойной ясности. Мягкий, дружелюбный знак.' },
      { id: '3f', href: '#c18', name: 'Журнал', why: 'Лист с одной отмеченной и одной открытой строкой: сделанные проверки честно отделены от оставшихся.' },
    ];
    return {
      rounds: [
        { label: 'Выбрано · 3d', title: 'Мозаика состояний — новый знак', lede: 'Три подтверждённых фрагмента и один пунктирный: неизвестное видно и допустимо. Файлы: assets/logo-mark.svg, logo-mark-white.svg, logo-lockup.svg, app-icon.svg. Прежний знак сохранён как logo-mark-legacy.svg.', opts: [{ id: '3d', href: '#c16', name: 'Мозаика состояний', why: 'Знак заменил прежний логотип в шапке, онбординге и документе схем ассистента.' }] },
        { label: 'Логотип · раунд 3', title: 'Другие смыслы: память, порядок, честность', lede: 'Без лупы и мозга. Знаки строятся на ценностях продукта: удержать нить, сохранить дословно, вернуться по шагам, показать неизвестное, дать ясность, вести журнал.', opts: r3 },
        { label: 'Логотип · раунд 2', title: 'Ещё шесть направлений', lede: 'Другие оси поиска: негативное пространство, разделённый знак, геометрия поиска, линейная последовательность, типографика и частичное заполнение.', opts: r2 },
        { label: 'Логотип · раунд 1', title: 'Варианты знака Mind Detective', lede: 'Шесть векторных знаков в градиенте бренда #4AEEFC → #005CFC: крупно, как иконка приложения, белым на синем, со словесным знаком и в мелких размерах.', opts: r1 },
      ],
    };
  }
}

</script>
</body>
</html>
