name: Task 6 integration

on:
  push:
    branches:
      - implementation/web-reconstruction-task6-state-ui

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: implementation/web-reconstruction-task6-state-ui
          fetch-depth: 0

      - name: Integrate approved Task 6 surface
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')

          # Web safety ingress must cover raw free-account text before portable mutation.
          local_path = root / 'apps/web/app/composables/useLocalExecution.ts'
          local = local_path.read_text(encoding='utf-8')
          old_ingress = """function enforceCommandIngress(command: CommandEnvelope): void {\n  if (command.command_type !== 'add_statement') return\n  const text = command.payload.original_text\n  if (typeof text === 'string') enforceSafeInput(text)\n}\n"""
          new_ingress = """function enforceCommandIngress(command: CommandEnvelope): void {\n  const text = command.command_type === 'add_statement'\n    ? command.payload.original_text\n    : command.command_type === 'record_free_account'\n      ? command.payload.text\n      : null\n  if (typeof text === 'string') enforceSafeInput(text)\n}\n"""
          if old_ingress not in local:
              raise SystemExit('useLocalExecution ingress marker not found')
          local_path.write_text(local.replace(old_ingress, new_ingress), encoding='utf-8')

          # RU/EN exact key parity. Copy explicitly states the epistemic boundary.
          ru_path = root / 'apps/web/app/lib/i18n/ru.ts'
          ru = ru_path.read_text(encoding='utf-8')
          ru_add = r'''  'reconstruction.title': 'Восстановление последовательности',
            'reconstruction.mode_label': 'Режим: восстановление',
            'reconstruction.scope': 'Этот режим структурирует только ваш рассказ и подтверждённые вами сведения. Он не устанавливает, где вещь находится на самом деле.',
            'reconstruction.entry.title': 'Нужно сначала восстановить события?',
            'reconstruction.entry.help': 'Можно перейти из нового дела в восстановление, зафиксировать свой рассказ и затем явно начать физический поиск.',
            'reconstruction.entry.action': 'Сначала восстановить события',
            'reconstruction.free_account.label': 'Исходный материал · дословно',
            'reconstruction.free_account.title': 'Свободный рассказ',
            'reconstruction.free_account.prompt': 'Опишите своими словами всё, что помните о последовательности событий. Текст будет сохранён дословно и не станет автоматически считаться фактом или воспоминанием.',
            'reconstruction.free_account.placeholder': 'Расскажите последовательность событий своими словами…',
            'reconstruction.free_account.submit': 'Сохранить рассказ',
            'reconstruction.free_account.saved': 'Ваш исходный рассказ — дословно',
            'reconstruction.statement.confirmed': 'Подтверждено пользователем',
            'reconstruction.statement.title': 'Добавить структурированное сведение',
            'reconstruction.statement.saved_title': 'Подтверждённые вами сведения',
            'reconstruction.statement.empty': 'Пока нет отдельно подтверждённых структурированных сведений.',
            'reconstruction.statement.type': 'Тип сведения',
            'reconstruction.statement.type.recollection': 'Воспоминание',
            'reconstruction.statement.type.habit': 'Обычная привычка',
            'reconstruction.statement.type.observation': 'Наблюдение',
            'reconstruction.statement.type.hypothesis': 'Гипотеза',
            'reconstruction.statement.text': 'Что вы сами помните или наблюдали?',
            'reconstruction.statement.event_time': 'Время события, если оно известно',
            'reconstruction.statement.unknown_time': 'Точное время неизвестно',
            'reconstruction.statement.limitation': 'Ограничение или неопределённость, указанная вами',
            'reconstruction.statement.submit': 'Подтвердить и добавить',
            'reconstruction.timeline.input_label': 'Ввод пользователя · без догадок системы',
            'reconstruction.timeline.title': 'Временная последовательность',
            'reconstruction.timeline.help': 'Свяжите только подтверждённые вами сведения с событиями. Неизвестные интервалы и противоречия вычислит канонический локальный исполнитель.',
            'reconstruction.timeline.event_label': 'Название события',
            'reconstruction.timeline.event_statement': 'Связанное подтверждённое сведение',
            'reconstruction.timeline.event_time': 'Время события, если известно',
            'reconstruction.timeline.precision': 'Точность времени',
            'reconstruction.timeline.precision.exact': 'Точное',
            'reconstruction.timeline.precision.approximate': 'Примерное',
            'reconstruction.timeline.precision.unknown': 'Неизвестное',
            'reconstruction.timeline.add_event': 'Добавить событие',
            'reconstruction.timeline.last_supported': 'Последний подтверждённый контакт',
            'reconstruction.timeline.first_missing': 'Первое замеченное отсутствие',
            'reconstruction.timeline.rebuild': 'Пересобрать временную линию',
            'reconstruction.timeline.system_derived': 'Результат системы · выведено из ваших данных',
            'reconstruction.timeline.summary_title': 'Сводка временной линии',
            'reconstruction.timeline.events': 'События',
            'reconstruction.timeline.unknowns': 'Что остаётся неизвестным',
            'reconstruction.timeline.contradictions': 'Противоречия в указанных данных',
            'reconstruction.timeline.time_unknown': 'Время не указано',
            'reconstruction.timeline.empty': 'Нет записей.',
            'reconstruction.search_transition.title': 'Готовы перейти от восстановления к проверкам?',
            'reconstruction.search_transition.help': 'Переход явный: сохранённые сведения останутся в деле, а следующий экран будет про физические проверки.',
            'reconstruction.to_search': 'Перейти к физическому поиску',
          '''
          if "'reconstruction.title'" not in ru:
              ru = ru.replace('\n} as const', '\n' + ru_add + '} as const')
          ru_path.write_text(ru, encoding='utf-8')

          en_path = root / 'apps/web/app/lib/i18n/en.ts'
          en = en_path.read_text(encoding='utf-8')
          en_add = r'''  'reconstruction.title': 'Rebuild the sequence',
            'reconstruction.mode_label': 'Mode: reconstruction',
            'reconstruction.scope': 'This mode structures only your account and facts you explicitly confirm. It does not establish where the item actually is.',
            'reconstruction.entry.title': 'Reconstruct the events first?',
            'reconstruction.entry.help': 'A new case can switch into reconstruction, preserve your own account, then explicitly move into physical search.',
            'reconstruction.entry.action': 'Reconstruct events first',
            'reconstruction.free_account.label': 'Raw account · verbatim',
            'reconstruction.free_account.title': 'Free account',
            'reconstruction.free_account.prompt': 'Describe the sequence in your own words. The text is preserved verbatim and is not automatically treated as a fact or recollection.',
            'reconstruction.free_account.placeholder': 'Describe the sequence in your own words…',
            'reconstruction.free_account.submit': 'Save account',
            'reconstruction.free_account.saved': 'Your original account — verbatim',
            'reconstruction.statement.confirmed': 'User-confirmed evidence',
            'reconstruction.statement.title': 'Add structured evidence',
            'reconstruction.statement.saved_title': 'Evidence you explicitly confirmed',
            'reconstruction.statement.empty': 'No separately confirmed structured evidence yet.',
            'reconstruction.statement.type': 'Evidence type',
            'reconstruction.statement.type.recollection': 'Recollection',
            'reconstruction.statement.type.habit': 'Habit',
            'reconstruction.statement.type.observation': 'Observation',
            'reconstruction.statement.type.hypothesis': 'Hypothesis',
            'reconstruction.statement.text': 'What do you personally remember or observe?',
            'reconstruction.statement.event_time': 'Event time, if known',
            'reconstruction.statement.unknown_time': 'Exact time is unknown',
            'reconstruction.statement.limitation': 'Limitation or uncertainty you provide',
            'reconstruction.statement.submit': 'Confirm and add',
            'reconstruction.timeline.input_label': 'User input · no system guesses',
            'reconstruction.timeline.title': 'Timeline',
            'reconstruction.timeline.help': 'Link only evidence you explicitly confirmed. The canonical local executor derives unknown intervals and contradictions.',
            'reconstruction.timeline.event_label': 'Event label',
            'reconstruction.timeline.event_statement': 'Linked confirmed evidence',
            'reconstruction.timeline.event_time': 'Event time, if known',
            'reconstruction.timeline.precision': 'Time precision',
            'reconstruction.timeline.precision.exact': 'Exact',
            'reconstruction.timeline.precision.approximate': 'Approximate',
            'reconstruction.timeline.precision.unknown': 'Unknown',
            'reconstruction.timeline.add_event': 'Add event',
            'reconstruction.timeline.last_supported': 'Last supported interaction',
            'reconstruction.timeline.first_missing': 'First noticed missing',
            'reconstruction.timeline.rebuild': 'Rebuild timeline',
            'reconstruction.timeline.system_derived': 'System-derived · from your evidence',
            'reconstruction.timeline.summary_title': 'Timeline summary',
            'reconstruction.timeline.events': 'Events',
            'reconstruction.timeline.unknowns': 'What remains unknown',
            'reconstruction.timeline.contradictions': 'Contradictions in the provided data',
            'reconstruction.timeline.time_unknown': 'Time not provided',
            'reconstruction.timeline.empty': 'No entries.',
            'reconstruction.search_transition.title': 'Ready to move from reconstruction to checking?',
            'reconstruction.search_transition.help': 'The transition is explicit: reconstruction evidence remains in the case, while the next screen focuses on physical checks.',
            'reconstruction.to_search': 'Switch to physical search',
          '''
          if "'reconstruction.title'" not in en:
              en = en.replace('\n} satisfies Record<CopyKey, string>', '\n' + en_add + '} satisfies Record<CopyKey, string>')
          en_path.write_text(en, encoding='utf-8')

          # Page orchestration delegates every mutation to the existing runCommand boundary.
          page_path = root / 'apps/web/app/pages/cases/[id].vue'
          page = page_path.read_text(encoding='utf-8')
          old_import = "import type { ActionFeedbackV2, CaseV2, CommandEnvelope, ProposalModel, SearchMethod } from '~/lib/api/contracts'"
          new_import = "import type { ActionFeedbackV2, CaseV2, CommandEnvelope, ProposalModel, RebuildTimelinePayload, SearchMethod } from '~/lib/api/contracts'\nimport { buildRecordFreeAccountPayload } from '~/composables/useReconstruction'"
          if old_import not in page:
              raise SystemExit('page import marker not found')
          page = page.replace(old_import, new_import)

          execution_marker = "const executionContractMismatch = computed(() => errorCode.value === EXECUTION_CONTRACT_MISMATCH)\n"
          eligibility = r'''const canEnterReconstruction = computed(() => {
            const current = caseValue.value
            if (!current || current.lifecycle !== 'active') return false
            const activeSession = evaluationSession.value
            if (activeSession && activeSession.outcome === null && activeSession.case_id === current.case_id) return false
            if (current.current_mode === 'unselected') return true
            if (current.current_mode !== 'search') return false
            return current.statements.length === 0
              && current.search_checks.length === 0
              && current.action_feedback.length === 0
          })
          '''
          if 'const canEnterReconstruction' not in page:
              page = page.replace(execution_marker, execution_marker + eligibility)

          switch_marker = """async function switchToSearch(): Promise<void> {\n  await runCommand(envelope('set_mode', { mode: 'search' }))\n}\n"""
          handlers = r'''

          async function enterReconstruction(): Promise<void> {
            if (!canEnterReconstruction.value) return
            await runCommand(envelope('set_mode', { mode: 'reconstruction' }))
          }

          async function recordFreeAccount(text: string): Promise<void> {
            await runCommand(envelope('record_free_account', {
              ...buildRecordFreeAccountPayload(crypto.randomUUID(), text),
            }))
          }

          async function addReconstructionStatement(payload: Record<string, unknown>): Promise<void> {
            await runCommand(envelope('add_statement', payload))
          }

          async function rebuildReconstructionTimeline(payload: RebuildTimelinePayload): Promise<void> {
            await runCommand(envelope('rebuild_timeline', { ...payload }))
          }
          '''
          if switch_marker not in page:
              raise SystemExit('switchToSearch marker not found')
          page = page.replace(switch_marker, switch_marker + handlers)

          needle = ':data-testid="caseValue.current_mode === \'reconstruction\' ? \'web-reconstruction-unavailable\' : \'web-search-only-boundary\'"'
          index = page.find(needle)
          if index < 0:
              raise SystemExit('legacy reconstruction boundary not found')
          start = page.rfind('      <aside', 0, index)
          end = page.find('      </aside>', index)
          if start < 0 or end < 0:
              raise SystemExit('legacy reconstruction boundary range not found')
          end += len('      </aside>')
          new_boundary = r'''      <aside
                v-if="caseValue.current_mode === 'search' && canEnterReconstruction && caseValue.lifecycle === 'active'"
                class="privacy-note"
                data-testid="reconstruction-entry"
              >
                <strong>{{ t('reconstruction.entry.title') }}</strong>
                <p>{{ t('reconstruction.entry.help') }}</p>
                <button class="secondary-action" data-testid="enter-reconstruction" type="button" :disabled="busy" @click="enterReconstruction">
                  {{ t('reconstruction.entry.action') }}
                </button>
              </aside>

              <aside
                v-if="caseValue.current_mode === 'unselected' && caseValue.lifecycle === 'active'"
                class="privacy-note"
                data-testid="mode-choice"
              >
                <strong>{{ t('reconstruction.entry.title') }}</strong>
                <p>{{ t('reconstruction.entry.help') }}</p>
                <div class="action-row">
                  <button class="secondary-action" data-testid="enter-reconstruction" type="button" :disabled="busy" @click="enterReconstruction">
                    {{ t('reconstruction.entry.action') }}
                  </button>
                  <button class="primary-action" data-testid="switch-to-search" type="button" :disabled="busy" @click="switchToSearch">
                    {{ t('reconstruction.to_search') }}
                  </button>
                </div>
              </aside>'''
          page = page[:start] + new_boundary + page[end:]

          shell_marker = """      <CaseShell\n        :case-value=\"caseValue\"\n"""
          reconstruction_shell = r'''      <article v-if="caseValue.current_mode === 'reconstruction'" class="hero-panel reconstruction-case" data-testid="reconstruction-case">
                <header class="reconstruction-case__header">
                  <div>
                    <NuxtLink to="/" class="muted">← {{ locale === 'ru' ? 'Все дела' : 'All cases' }}</NuxtLink>
                    <h1>{{ caseValue.item_label }}</h1>
                  </div>
                  <button
                    v-if="caseValue.lifecycle === 'active'"
                    class="secondary-action"
                    data-testid="pause-case"
                    type="button"
                    :disabled="busy"
                    @click="pauseCase"
                  >
                    {{ locale === 'ru' ? 'Приостановить' : 'Pause' }}
                  </button>
                </header>
                <ModeBanner :mode="caseValue.current_mode" />
                <ReconstructionPanel
                  :case-value="caseValue"
                  :pending="busy"
                  @record-free-account="recordFreeAccount"
                  @add-statement="addReconstructionStatement"
                  @rebuild-timeline="rebuildReconstructionTimeline"
                  @switch-to-search="switchToSearch"
                />
              </article>

              <CaseShell
                v-if="caseValue.current_mode !== 'reconstruction'"
                :case-value="caseValue"
          '''
          if shell_marker not in page:
              raise SystemExit('CaseShell marker not found')
          page = page.replace(shell_marker, reconstruction_shell, 1)
          page_path.write_text(page, encoding='utf-8')

          # Exact i18n contract tests.
          i18n_path = root / 'apps/web/tests/unit/i18n.spec.ts'
          i18n = i18n_path.read_text(encoding='utf-8')
          parity = "  it('keeps exact key parity', () => {\n    expect(copyKeys('ru')).toEqual(copyKeys('en'))\n  })\n"
          extra = r'''

          it('keeps the complete reconstruction copy contract and epistemic boundary', () => {
            const required = [
              'reconstruction.title',
              'reconstruction.free_account.title',
              'reconstruction.free_account.prompt',
              'reconstruction.free_account.submit',
              'reconstruction.free_account.saved',
              'reconstruction.statement.title',
              'reconstruction.statement.type',
              'reconstruction.statement.text',
              'reconstruction.statement.event_time',
              'reconstruction.statement.unknown_time',
              'reconstruction.timeline.title',
              'reconstruction.timeline.rebuild',
              'reconstruction.timeline.unknowns',
              'reconstruction.timeline.contradictions',
              'reconstruction.to_search',
              'reconstruction.mode_label',
            ]
            for (const key of required) {
              expect(copyKeys('ru')).toContain(key)
              expect(copyKeys('en')).toContain(key)
            }
            expect(translate('ru', 'reconstruction.scope')).toContain('не устанавливает')
            expect(translate('en', 'reconstruction.scope').toLowerCase()).toContain('does not establish')
          })
          '''
          if 'complete reconstruction copy contract' not in i18n:
              i18n = i18n.replace(parity, parity + extra)
          i18n_path.write_text(i18n, encoding='utf-8')

          # Existing boundary test now asserts the real state-first panel.
          resume_path = root / 'apps/web/tests/e2e/create-resume.spec.ts'
          resume = resume_path.read_text(encoding='utf-8')
          resume = resume.replace(
              "test('legacy reconstruction case is read-only in Web and offers an explicit handoff to physical search'",
              "test('legacy reconstruction case opens the state-first panel and preserves explicit handoff to physical search'",
          )
          resume = resume.replace("await expect(page.getByTestId('web-reconstruction-unavailable')).toBeVisible()", "await expect(page.getByTestId('reconstruction-panel')).toBeVisible()")
          resume_path.write_text(resume, encoding='utf-8')

          # Active-path proof: safety ingress occurs before raw-account mutation.
          flow_path = root / 'apps/web/tests/e2e/reconstruction-flow.spec.ts'
          flow = flow_path.read_text(encoding='utf-8')
          safety_case = r'''

          test('raw free account passes safety ingress before reconstruction mutation', async ({ page }) => {
            await page.goto('/')
            await page.getByLabel('Что потерялось?').fill('ключи')
            await page.getByTestId('start-search').click()
            const caseId = page.url().split('/cases/')[1]?.split(/[?#]/)[0]
            expect(caseId).toBeTruthy()

            await page.getByTestId('enter-reconstruction').click()
            await page.getByTestId('free-account-input').fill('Я выключил плиту перед уходом?')
            await page.getByTestId('free-account-submit').click()

            await expect(page.getByTestId('case-safety-route')).toBeVisible()
            const persisted = await storedCase(page, caseId!)
            expect(persisted?.current_mode).toBe('reconstruction')
            expect(persisted?.interaction_journal).toEqual([])
          })
          '''
          if 'raw free account passes safety ingress' not in flow:
              flow += safety_case
          flow_path.write_text(flow, encoding='utf-8')
          PY

          git rm .github/workflows/task6-integrate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/app/pages/cases/'[id].vue' \
            apps/web/app/lib/i18n/ru.ts \
            apps/web/app/lib/i18n/en.ts \
            apps/web/app/composables/useLocalExecution.ts \
            apps/web/tests/unit/i18n.spec.ts \
            apps/web/tests/e2e/reconstruction-flow.spec.ts \
            apps/web/tests/e2e/create-resume.spec.ts
          git commit -m "feat: integrate state-first web reconstruction ui"
          git push origin HEAD:implementation/web-reconstruction-task6-state-ui
