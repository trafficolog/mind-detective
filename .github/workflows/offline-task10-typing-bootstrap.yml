name: Offline Task 10 typing bootstrap

on:
  push:
    branches: [feature/offline-execution-0.3.0]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - name: Remove cross-branch typed local shadowing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('plugins/mind-detective/scripts/conformance_vectors.py')
          text = path.read_text(encoding='utf-8')
          old = '''    elif operation == "proposal":\n        case = input_value["case"]\n        mode = input_value["mode"]\n        if not isinstance(case, dict) or not isinstance(mode, str):\n            raise AssertionError("proposal vector shape")\n        expected = _capture(lambda: build_checklist_proposal_json(case, mode))\n'''
          new = '''    elif operation == "proposal":\n        proposal_case = input_value["case"]\n        mode = input_value["mode"]\n        if not isinstance(proposal_case, dict) or not isinstance(mode, str):\n            raise AssertionError("proposal vector shape")\n        expected = _capture(lambda: build_checklist_proposal_json(proposal_case, mode))\n'''
          if old not in text:
              raise SystemExit('expected proposal oracle snippet not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit typing-only oracle cleanup
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/offline-task10-typing-bootstrap.yml
          git add plugins/mind-detective/scripts/conformance_vectors.py .github/workflows/offline-task10-typing-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: remove conformance oracle type shadowing"
          git push origin HEAD:feature/offline-execution-0.3.0
