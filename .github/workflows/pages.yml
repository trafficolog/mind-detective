name: Deploy Web/PWA to GitHub Pages

# Publishes the static Web/PWA (apps/web) so it can be opened and installed on a phone over HTTPS.
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static PWA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 12.3.4
          run_install: false
      - name: Install Web dependencies
        run: pnpm install --frozen-lockfile
      - name: Build for the Pages base path
        shell: bash
        run: |
          set -euo pipefail
          base="${{ steps.pages.outputs.base_path }}/"
          echo "PAGES_BASE=$base" >> "$GITHUB_ENV"
          NUXT_APP_BASE_URL="$base" pnpm --dir apps/web build
      - name: Verify the build is self-contained under the base path
        run: python scripts/check_pages_build.py apps/web/.output/public "$PAGES_BASE"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: apps/web/.output/public

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
