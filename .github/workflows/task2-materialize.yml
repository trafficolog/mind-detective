name: Materialize Task 2 tree

on:
  push:
    branches:
      - implementation/web-reconstruction-task2-free-account

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: implementation/web-reconstruction-task2-free-account
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Apply reviewed Task 2 patch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path: str, old: str, new: str, *, count: int = 1) -> None:
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(f"{path}: expected {count} occurrence(s), found {actual}: {old[:80]!r}")
              file.write_text(text.replace(old, new, count), encoding="utf-8")

          # Portable contract: expose the new command and stable reconstruction errors.
          replace(
              "plugins/mind-detective/scripts/portable_contract.py",
              '    "set_mode",\n    "add_statement",',
              '    "set_mode",\n    "record_free_account",\n    "add_statement",',
          )
          replace(
              "plugins/mind-detective/scripts/portable_contract.py",
              '        "MD_WEB_EXECUTION_CONTRACT_MISMATCH",\n',
              '        "MD_WEB_EXECUTION_CONTRACT_MISMATCH",\n'
              '        "MD_RECON_MODE_REQUIRED",\n'
              '        "MD_RECON_FREE_ACCOUNT_REQUIRED",\n'
              '        "MD_RECON_FREE_ACCOUNT_EXISTS",\n',
          )

          kernel = "plugins/mind-detective/scripts/portable_kernel.py"
          replace(
              kernel,
              '    "set_mode": frozenset({"mode"}),\n    "add_statement": frozenset(',
              '    "set_mode": frozenset({"mode"}),\n'
              '    "record_free_account": frozenset({"entry_id", "text"}),\n'
              '    "add_statement": frozenset(',
          )
          replace(
              kernel,
              '''    journal.append(clone_json(entry))
              return result


              def record_action_feedback_json(
              ''',
              '''    journal.append(clone_json(entry))
              return result


              def has_free_account_json(case: dict[str, object]) -> bool:
                  _ensure_case_shape(case)
                  journal = _as_list(case["interaction_journal"], "interaction_journal")
                  for raw in journal:
                      entry = _as_dict(raw, "interaction_journal_entry")
                      if (
                          entry.get("author") == "user"
                          and entry.get("mode") == "reconstruction"
                          and entry.get("entry_type") == "free_account"
                      ):
                          return True
                  return False


              def record_free_account_json(
                  case: dict[str, object],
                  entry_id: str,
                  text: str,
                  now: str,
              ) -> dict[str, object]:
                  if not entry_id:
                      portable_error("MD_WEB_COMMAND_PAYLOAD", "entry_id must be a non-empty string")
                  if not text:
                      portable_error("MD_WEB_COMMAND_PAYLOAD", "text must be a non-empty string")
                  _ensure_case_shape(case)
                  _ensure_mutable(case)
                  if _required_str(case, "lifecycle") != "active":
                      portable_error("MD_CASE_STATE", "free account requires an active case")
                  if _required_str(case, "current_mode") != "reconstruction":
                      portable_error("MD_RECON_MODE_REQUIRED", "free account requires reconstruction mode")
                  if has_free_account_json(case):
                      portable_error("MD_RECON_FREE_ACCOUNT_EXISTS", "free account is already recorded")
                  result = _primitive_copy(case, now)
                  journal = _as_list(result["interaction_journal"], "interaction_journal")
                  journal.append(
                      {
                          "id": entry_id,
                          "author": "user",
                          "mode": "reconstruction",
                          "entry_type": "free_account",
                          "text": text,
                          "created_at": now,
                          "statement_ids": [],
                          "search_check_ids": [],
                      }
                  )
                  return result


              def record_action_feedback_json(
              ''',
          )
          replace(
              kernel,
              '''    if command_type == "set_mode":
                  return set_mode_json(case, _required_str(payload, "mode"), now)
              if command_type == "add_statement":
                  mode = _journal_mode(case)
                  statement = _statement_from_payload(payload, now)
              ''',
              '''    if command_type == "set_mode":
                  return set_mode_json(case, _required_str(payload, "mode"), now)
              if command_type == "record_free_account":
                  return record_free_account_json(
                      case,
                      _required_str(payload, "entry_id"),
                      _required_str(payload, "text"),
                      now,
                  )
              if command_type == "add_statement":
                  mode = _journal_mode(case)
                  if mode == "reconstruction" and not has_free_account_json(case):
                      portable_error(
                          "MD_RECON_FREE_ACCOUNT_REQUIRED",
                          "record a free account before detailed reconstruction statements",
                      )
                  statement = _statement_from_payload(payload, now)
              ''',
          )
          replace(
              kernel,
              '    "create_case",\n    "pause_json",',
              '    "create_case",\n    "has_free_account_json",\n    "pause_json",',
          )
          replace(
              kernel,
              '    "record_action_feedback_json",\n    "record_search_check_json",',
              '    "record_action_feedback_json",\n    "record_free_account_json",\n    "record_search_check_json",',
          )

          controller = "plugins/mind-detective/scripts/controller.py"
          replace(
              controller,
              '    record_action_feedback_json,\n    record_search_check_json,',
              '    record_action_feedback_json,\n    record_free_account_json,\n    record_search_check_json,',
          )
          replace(
              controller,
              '''        except PortableKernelError as exc:
                  raise self._case_error(exc) from exc

              def record_action_feedback(self, case: Case, feedback: ActionFeedback, now: str) -> Case:
              ''',
              '''        except PortableKernelError as exc:
                  raise self._case_error(exc) from exc

              def record_free_account(
                  self,
                  case: Case,
                  entry_id: str,
                  text: str,
                  now: str,
              ) -> Case:
                  self._enforce_safe_ingress(text)
                  try:
                      return self._from_portable(
                          record_free_account_json(case_to_dict(case), entry_id, text, now)
                      )
                  except PortableKernelError as exc:
                      raise self._case_error(exc) from exc

              def record_action_feedback(self, case: Case, feedback: ActionFeedback, now: str) -> Case:
              ''',
          )

          # Keep the existing recollection conformance vector semantically successful under the new gate.
          conformance = "plugins/mind-detective/scripts/conformance_vectors.py"
          replace(
              conformance,
              '''    reconstruction = apply_command(base, set_reconstruction)

              reconstruction_statement = _command(
                  reconstruction,
                  "add_statement",
              ''',
              '''    reconstruction = apply_command(base, set_reconstruction)

              free_account = _command(
                  reconstruction,
                  "record_free_account",
                  command_id="cmd-free-account",
                  now="2026-09-10T17:31:02.500Z",
                  payload={
                      "entry_id": "free-account-1",
                      "text": "Я пытаюсь вспомнить последовательность перед пропажей ключей",
                  },
              )
              reconstruction_with_account = apply_command(reconstruction, free_account)

              reconstruction_statement = _command(
                  reconstruction_with_account,
                  "add_statement",
              ''',
          )
          replace(
              conformance,
              '{"case": reconstruction, "command": reconstruction_statement},',
              '{"case": reconstruction_with_account, "command": reconstruction_statement},',
          )

          contract_test = "plugins/mind-detective/tests/test_portable_contract.py"
          replace(
              contract_test,
              '                "set_mode",\n                "add_statement",',
              '                "set_mode",\n                "record_free_account",\n                "add_statement",',
          )
          replace(
              contract_test,
              '                    "MD_WEB_EXECUTION_CONTRACT_MISMATCH",\n',
              '                    "MD_WEB_EXECUTION_CONTRACT_MISMATCH",\n'
              '                    "MD_RECON_MODE_REQUIRED",\n'
              '                    "MD_RECON_FREE_ACCOUNT_REQUIRED",\n'
              '                    "MD_RECON_FREE_ACCOUNT_EXISTS",\n',
          )

          kernel_test = "plugins/mind-detective/tests/test_portable_kernel.py"
          replace(
              kernel_test,
              'from scripts.portable_kernel import apply_command, create_case  # noqa: E402',
              'from scripts.portable_kernel import apply_command, create_case, has_free_account_json  # noqa: E402',
          )
          replace(
              kernel_test,
              'class PortableKernelTests(unittest.TestCase):\n    def test_create_case_matches_case_v2_shape(self):',
              '''class PortableKernelTests(unittest.TestCase):
                  def _reconstruction_case(self) -> dict[str, object]:
                      case = create_case("case-1", "keys", "2026-09-10T18:00:00Z")
                      return apply_command(
                          case,
                          command(
                              "set_mode",
                              command_id="cmd-mode",
                              expected="2026-09-10T18:00:00Z",
                              now="2026-09-10T18:01:00Z",
                              payload={"mode": "reconstruction"},
                          ),
                      )

                  def _with_free_account(self, case: dict[str, object]) -> dict[str, object]:
                      return apply_command(
                          case,
                          command(
                              "record_free_account",
                              command_id="cmd-free-account",
                              expected=str(case["updated_at"]),
                              now="2026-09-10T18:01:30Z",
                              payload={
                                  "entry_id": "free-1",
                                  "text": "Я пришёл домой, но не помню куда положил ключи.",
                              },
                          ),
                      )

                  def test_create_case_matches_case_v2_shape(self):''',
          )
          replace(
              kernel_test,
              '''        self.assertEqual(search["current_mode"], "search")
                  self.assertEqual(paused["lifecycle"], "paused")

              def test_search_suggestion_creates_exact_user_supported_candidate_and_journal(self):
              ''',
              '''        self.assertEqual(search["current_mode"], "search")
                  self.assertEqual(paused["lifecycle"], "paused")

              def test_record_free_account_preserves_verbatim_user_journal_without_statement(self):
                  case = self._reconstruction_case()
                  result = self._with_free_account(case)
                  self.assertTrue(has_free_account_json(result))
                  self.assertEqual(result["statements"], [])
                  journal = result["interaction_journal"]
                  self.assertIsInstance(journal, list)
                  assert isinstance(journal, list)
                  self.assertEqual(
                      journal[-1],
                      {
                          "id": "free-1",
                          "author": "user",
                          "mode": "reconstruction",
                          "entry_type": "free_account",
                          "text": "Я пришёл домой, но не помню куда положил ключи.",
                          "created_at": "2026-09-10T18:01:30Z",
                          "statement_ids": [],
                          "search_check_ids": [],
                      },
                  )

              def test_record_free_account_rejects_second_account_and_missing_gate(self):
                  case = self._reconstruction_case()
                  statement = {
                      "statement_id": "stmt-1",
                      "source": "user",
                      "statement_type": "recollection",
                      "original_text": "Ключи были у двери",
                  }
                  with self.assertRaises(PortableKernelError) as missing:
                      apply_command(
                          case,
                          command(
                              "add_statement",
                              command_id="cmd-statement",
                              expected="2026-09-10T18:01:00Z",
                              now="2026-09-10T18:02:00Z",
                              payload=statement,
                          ),
                      )
                  self.assertEqual(missing.exception.code, "MD_RECON_FREE_ACCOUNT_REQUIRED")
                  with_account = self._with_free_account(case)
                  with self.assertRaises(PortableKernelError) as duplicate:
                      apply_command(
                          with_account,
                          command(
                              "record_free_account",
                              command_id="cmd-free-2",
                              expected="2026-09-10T18:01:30Z",
                              now="2026-09-10T18:02:00Z",
                              payload={"entry_id": "free-2", "text": "second account"},
                          ),
                      )
                  self.assertEqual(duplicate.exception.code, "MD_RECON_FREE_ACCOUNT_EXISTS")

              def test_search_suggestion_creates_exact_user_supported_candidate_and_journal(self):
              ''',
          )
          replace(
              kernel_test,
              '''    def test_reconstruction_search_suggestion_does_not_create_candidate(self):
                  case = create_case("case-1", "keys", "2026-09-10T18:00:00Z")
                  case = apply_command(
                      case,
                      command(
                          "set_mode",
                          command_id="cmd-mode",
                          expected="2026-09-10T18:00:00Z",
                          now="2026-09-10T18:01:00Z",
                          payload={"mode": "reconstruction"},
                      ),
                  )
                  result = apply_command(
              ''',
              '''    def test_reconstruction_search_suggestion_does_not_create_candidate(self):
                  case = self._with_free_account(self._reconstruction_case())
                  result = apply_command(
              ''',
          )
          replace(
              kernel_test,
              '                expected="2026-09-10T18:01:00Z",\n                now="2026-09-10T18:02:00Z",\n                payload={\n                    "statement_id": "stmt-1",\n                    "source": "user",\n                    "statement_type": "search_suggestion",\n                    "original_text": "машина",',
              '                expected="2026-09-10T18:01:30Z",\n                now="2026-09-10T18:02:00Z",\n                payload={\n                    "statement_id": "stmt-1",\n                    "source": "user",\n                    "statement_type": "search_suggestion",\n                    "original_text": "машина",',
          )

          controller_test = "plugins/mind-detective/tests/test_controller.py"
          replace(
              controller_test,
              'from scripts.journal import JournalAuthor, JournalEntry, JournalMode  # noqa: E402',
              'from scripts.journal import InteractionMode, JournalAuthor, JournalEntry, JournalMode  # noqa: E402',
          )
          replace(
              controller_test,
              '''        self.assertEqual(ctx.exception.code, "MD_SAFE_SECURITY_ACTION")
                  self.assertEqual(self.case.interaction_journal, ())

              def test_lifecycle_create_pause_resume_close(self):
              ''',
              '''        self.assertEqual(ctx.exception.code, "MD_SAFE_SECURITY_ACTION")
                  self.assertEqual(self.case.interaction_journal, ())

              def test_controller_records_verbatim_free_account_after_reconstruction_mode(self):
                  reconstruction = self.controller.set_mode(
                      self.case,
                      InteractionMode.RECONSTRUCTION,
                      "2026-09-09T18:00:30Z",
                  )
                  updated = self.controller.record_free_account(
                      reconstruction,
                      "free-1",
                      "Я пришёл домой, но не помню куда положил ключи.",
                      "2026-09-09T18:01:00Z",
                  )
                  self.assertEqual(updated.statements, ())
                  self.assertEqual(len(updated.interaction_journal), 1)
                  entry = updated.interaction_journal[0]
                  self.assertEqual(entry.id, "free-1")
                  self.assertEqual(entry.author, JournalAuthor.USER)
                  self.assertEqual(entry.mode, JournalMode.RECONSTRUCTION)
                  self.assertEqual(entry.entry_type, "free_account")
                  self.assertEqual(entry.text, "Я пришёл домой, но не помню куда положил ключи.")

              def test_high_risk_free_account_exits_before_case_mutation(self):
                  reconstruction = self.controller.set_mode(
                      self.case,
                      InteractionMode.RECONSTRUCTION,
                      "2026-09-09T18:00:30Z",
                  )
                  with self.assertRaises(CaseError) as ctx:
                      self.controller.record_free_account(
                          reconstruction,
                          "free-risk",
                          "Я запер входную дверь?",
                          "2026-09-09T18:01:00Z",
                      )
                  self.assertEqual(ctx.exception.code, "MD_SAFE_SECURITY_ACTION")
                  self.assertEqual(reconstruction.interaction_journal, ())

              def test_lifecycle_create_pause_resume_close(self):
              ''',
          )

          parity_test = "plugins/mind-detective/tests/test_controller_portable_parity.py"
          replace(
              parity_test,
              '    record_action_feedback_json,\n    resume_json,',
              '    record_action_feedback_json,\n    record_free_account_json,\n    resume_json,',
          )
          replace(
              parity_test,
              '''        portable = set_mode_json(case_to_dict(self.case), "search", "2026-09-10T18:01:00Z")
                  self.assertEqual(case_to_dict(typed), portable)

              def test_lifecycle_matches_portable_primitives(self):
              ''',
              '''        portable = set_mode_json(case_to_dict(self.case), "search", "2026-09-10T18:01:00Z")
                  self.assertEqual(case_to_dict(typed), portable)

              def test_record_free_account_matches_portable_primitive(self):
                  reconstruction = self.controller.set_mode(
                      self.case,
                      InteractionMode.RECONSTRUCTION,
                      "2026-09-10T18:01:00Z",
                  )
                  typed = self.controller.record_free_account(
                      reconstruction,
                      "free-1",
                      "Я пришёл домой, но не помню куда положил ключи.",
                      "2026-09-10T18:02:00Z",
                  )
                  portable = record_free_account_json(
                      case_to_dict(reconstruction),
                      "free-1",
                      "Я пришёл домой, но не помню куда положил ключи.",
                      "2026-09-10T18:02:00Z",
                  )
                  self.assertEqual(case_to_dict(typed), portable)

              def test_lifecycle_matches_portable_primitives(self):
              ''',
          )
          PY
      - name: Verify Task 2 focused tests
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s plugins/mind-detective/tests -p 'test_portable_contract.py' -v
          python -m unittest discover -s plugins/mind-detective/tests -p 'test_portable_kernel.py' -v
          python -m unittest discover -s plugins/mind-detective/tests -p 'test_controller.py' -v
          python -m unittest discover -s plugins/mind-detective/tests -p 'test_controller_portable_parity.py' -v
      - name: Regenerate certified executor and conformance corpus
        shell: bash
        run: |
          set -euo pipefail
          python -m scripts.write_local_execution_artifacts
          python -m scripts.generate_local_execution_corpus
          python -m compileall -q plugins/mind-detective/scripts plugins/mind-detective/tests
      - name: Commit materialized Task 2 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            plugins/mind-detective/scripts/portable_contract.py \
            plugins/mind-detective/scripts/portable_kernel.py \
            plugins/mind-detective/scripts/controller.py \
            plugins/mind-detective/scripts/conformance_vectors.py \
            plugins/mind-detective/tests/test_portable_contract.py \
            plugins/mind-detective/tests/test_portable_kernel.py \
            plugins/mind-detective/tests/test_controller.py \
            plugins/mind-detective/tests/test_controller_portable_parity.py \
            apps/web/app/generated/localExecution.ts \
            apps/web/app/generated/localExecution.meta.json \
            conformance/local-execution/v1/vectors.json \
            conformance/local-execution/v1/manifest.json
          git diff --cached --quiet && { echo 'No Task 2 changes materialized'; exit 1; }
          git commit -m 'feat: add canonical reconstruction free account'
          git push origin HEAD:implementation/web-reconstruction-task2-free-account
