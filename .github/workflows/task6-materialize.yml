name: Task 6 materializer

on:
  push:
    branches:
      - implementation/web-reconstruction-task6-state-ui

permissions:
  contents: write

jobs:
  materialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: implementation/web-reconstruction-task6-state-ui
          fetch-depth: 0

      - name: Materialize approved Task 6 files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          root = Path('.')
          components = root / 'apps/web/app/components/reconstruction'
          components.mkdir(parents=True, exist_ok=True)

          (components / 'FreeAccountCard.vue').write_text(r'''<script setup lang="ts">
          const props = defineProps<{
            savedText: string | null
            pending: boolean
          }>()

          const emit = defineEmits<{
            submit: [text: string]
          }>()

          const { t } = useCopy()
          const draft = ref('')

          function submit(): void {
            if (!draft.value.trim()) return
            emit('submit', draft.value)
          }
          </script>

          <template>
            <section class="reconstruction-card" data-testid="free-account-card">
              <header class="reconstruction-card__heading">
                <span class="reconstruction-card__icon" aria-hidden="true">✎</span>
                <div>
                  <p class="eyebrow">{{ t('reconstruction.free_account.label') }}</p>
                  <h2>{{ t('reconstruction.free_account.title') }}</h2>
                </div>
              </header>
              <p class="reconstruction-card__help">{{ t('reconstruction.free_account.prompt') }}</p>

              <form v-if="props.savedText === null" class="reconstruction-form" @submit.prevent="submit">
                <textarea
                  v-model="draft"
                  data-testid="free-account-input"
                  rows="6"
                  :disabled="props.pending"
                  :placeholder="t('reconstruction.free_account.placeholder')"
                />
                <button
                  class="primary-action"
                  data-testid="free-account-submit"
                  type="submit"
                  :disabled="props.pending || !draft.trim()"
                >
                  {{ t('reconstruction.free_account.submit') }}
                </button>
              </form>

              <div v-else class="raw-account" data-testid="free-account-saved">
                <strong>{{ t('reconstruction.free_account.saved') }}</strong>
                <p>{{ props.savedText }}</p>
              </div>
            </section>
          </template>

          <style scoped>
          .reconstruction-card {
            display: grid;
            gap: 1rem;
            padding: 1.25rem;
            border: 1px solid var(--line);
            border-radius: 1rem;
            background: var(--panel);
          }
          .reconstruction-card__heading {
            display: flex;
            gap: .75rem;
            align-items: flex-start;
          }
          .reconstruction-card__heading h2,
          .reconstruction-card__heading p,
          .raw-account p { margin: 0; }
          .reconstruction-card__icon {
            display: inline-grid;
            place-items: center;
            min-width: 2rem;
            height: 2rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-weight: 800;
          }
          .reconstruction-card__help { margin: 0; color: var(--muted); }
          .reconstruction-form { display: grid; gap: .75rem; }
          textarea {
            width: 100%;
            box-sizing: border-box;
            min-height: 8rem;
            resize: vertical;
          }
          .raw-account {
            display: grid;
            gap: .5rem;
            padding: 1rem;
            border: 1px dashed var(--line);
            border-radius: .75rem;
          }
          .raw-account p { white-space: pre-wrap; }
          </style>
          ''', encoding='utf-8')

          (components / 'StatementCapture.vue').write_text(r'''<script setup lang="ts">
          const props = defineProps<{
            pending: boolean
          }>()

          const emit = defineEmits<{
            submit: [payload: Record<string, unknown>]
          }>()

          const { t } = useCopy()
          const statementType = ref<'recollection' | 'habit' | 'observation' | 'hypothesis'>('recollection')
          const text = ref('')
          const eventTime = ref('')
          const unknownTime = ref(false)
          const limitation = ref('')

          function normalizedDateTime(value: string): string | null {
            if (!value) return null
            return value.length === 16 ? `${value}:00` : value
          }

          function submit(): void {
            if (!text.value.trim()) return
            emit('submit', {
              statement_id: crypto.randomUUID(),
              source: 'user',
              statement_type: statementType.value,
              original_text: text.value,
              event_time: unknownTime.value ? null : normalizedDateTime(eventTime.value),
              user_confirmation: true,
              supporting_evidence_ids: [],
              limitations: limitation.value.trim() ? [limitation.value.trim()] : [],
            })
          }
          </script>

          <template>
            <section class="reconstruction-card" data-testid="statement-capture">
              <header class="reconstruction-card__heading">
                <span class="reconstruction-card__icon" aria-hidden="true">✓</span>
                <div>
                  <p class="eyebrow">{{ t('reconstruction.statement.confirmed') }}</p>
                  <h2>{{ t('reconstruction.statement.title') }}</h2>
                </div>
              </header>

              <form class="reconstruction-form" @submit.prevent="submit">
                <label>
                  <span>{{ t('reconstruction.statement.type') }}</span>
                  <select v-model="statementType" data-testid="statement-type" :disabled="props.pending">
                    <option value="recollection">{{ t('reconstruction.statement.type.recollection') }}</option>
                    <option value="habit">{{ t('reconstruction.statement.type.habit') }}</option>
                    <option value="observation">{{ t('reconstruction.statement.type.observation') }}</option>
                    <option value="hypothesis">{{ t('reconstruction.statement.type.hypothesis') }}</option>
                  </select>
                </label>

                <label>
                  <span>{{ t('reconstruction.statement.text') }}</span>
                  <textarea v-model="text" data-testid="statement-text" rows="3" :disabled="props.pending" />
                </label>

                <label>
                  <span>{{ t('reconstruction.statement.event_time') }}</span>
                  <input
                    v-model="eventTime"
                    data-testid="statement-event-time"
                    type="datetime-local"
                    :disabled="props.pending || unknownTime"
                  />
                </label>

                <label class="check-row">
                  <input v-model="unknownTime" data-testid="statement-unknown-time" type="checkbox" :disabled="props.pending" />
                  <span>{{ t('reconstruction.statement.unknown_time') }}</span>
                </label>

                <label>
                  <span>{{ t('reconstruction.statement.limitation') }}</span>
                  <input v-model="limitation" data-testid="statement-limitation" type="text" :disabled="props.pending" />
                </label>

                <button class="primary-action" data-testid="statement-submit" type="submit" :disabled="props.pending || !text.trim()">
                  {{ t('reconstruction.statement.submit') }}
                </button>
              </form>
            </section>
          </template>

          <style scoped>
          .reconstruction-card {
            display: grid;
            gap: 1rem;
            padding: 1.25rem;
            border: 1px solid var(--line);
            border-radius: 1rem;
            background: var(--panel);
          }
          .reconstruction-card__heading { display: flex; gap: .75rem; align-items: flex-start; }
          .reconstruction-card__heading h2,
          .reconstruction-card__heading p { margin: 0; }
          .reconstruction-card__icon {
            display: inline-grid;
            place-items: center;
            min-width: 2rem;
            height: 2rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-weight: 800;
          }
          .reconstruction-form { display: grid; gap: .9rem; }
          label { display: grid; gap: .35rem; font-weight: 700; }
          input, select, textarea { width: 100%; box-sizing: border-box; }
          textarea { resize: vertical; }
          .check-row { display: flex; align-items: center; gap: .5rem; font-weight: 600; }
          .check-row input { width: auto; }
          </style>
          ''', encoding='utf-8')

          (components / 'TimelineEditor.vue').write_text(r'''<script setup lang="ts">
          import type { RebuildTimelinePayload, StatementV2, TimelineEventV2, TimelineV2 } from '~/lib/api/contracts'
          import { buildRebuildTimelinePayload } from '~/composables/useReconstruction'

          const props = defineProps<{
            statements: StatementV2[]
            timeline: TimelineV2 | null
            pending: boolean
          }>()

          const emit = defineEmits<{
            rebuild: [payload: RebuildTimelinePayload]
          }>()

          const { t } = useCopy()
          const events = ref<TimelineEventV2[]>(structuredClone(props.timeline?.events ?? []))
          const eventLabel = ref('')
          const eventStatementId = ref('')
          const eventTime = ref('')
          const eventPrecision = ref('approximate')
          const lastSupported = ref(props.timeline?.last_supported_interaction_id ?? '')
          const firstMissing = ref(props.timeline?.first_noticed_missing_id ?? '')

          watch(
            () => props.timeline,
            (timeline) => {
              if (!timeline) return
              events.value = structuredClone(timeline.events)
              lastSupported.value = timeline.last_supported_interaction_id ?? ''
              firstMissing.value = timeline.first_noticed_missing_id ?? ''
            },
            { deep: true },
          )

          function normalizedDateTime(value: string): string | null {
            if (!value) return null
            return value.length === 16 ? `${value}:00` : value
          }

          function addEvent(): void {
            if (!eventLabel.value.trim() || !eventStatementId.value) return
            events.value.push({
              id: crypto.randomUUID(),
              label: eventLabel.value.trim(),
              statement_ids: [eventStatementId.value],
              event_time: normalizedDateTime(eventTime.value),
              time_precision: eventPrecision.value,
            })
            eventLabel.value = ''
            eventStatementId.value = ''
            eventTime.value = ''
            eventPrecision.value = 'approximate'
          }

          function rebuild(): void {
            emit('rebuild', buildRebuildTimelinePayload(
              structuredClone(events.value),
              lastSupported.value || null,
              firstMissing.value || null,
            ))
          }
          </script>

          <template>
            <section class="reconstruction-card" data-testid="timeline-editor">
              <header class="reconstruction-card__heading">
                <span class="reconstruction-card__icon" aria-hidden="true">↔</span>
                <div>
                  <p class="eyebrow">{{ t('reconstruction.timeline.input_label') }}</p>
                  <h2>{{ t('reconstruction.timeline.title') }}</h2>
                </div>
              </header>
              <p class="muted">{{ t('reconstruction.timeline.help') }}</p>

              <div class="timeline-form">
                <label>
                  <span>{{ t('reconstruction.timeline.event_label') }}</span>
                  <input v-model="eventLabel" data-testid="timeline-event-label" type="text" :disabled="props.pending" />
                </label>
                <label>
                  <span>{{ t('reconstruction.timeline.event_statement') }}</span>
                  <select v-model="eventStatementId" data-testid="timeline-event-statement" :disabled="props.pending">
                    <option value="">—</option>
                    <option v-for="statement in props.statements" :key="statement.id" :value="statement.id">
                      {{ statement.original_text }}
                    </option>
                  </select>
                </label>
                <label>
                  <span>{{ t('reconstruction.timeline.event_time') }}</span>
                  <input v-model="eventTime" data-testid="timeline-event-time" type="datetime-local" :disabled="props.pending" />
                </label>
                <label>
                  <span>{{ t('reconstruction.timeline.precision') }}</span>
                  <select v-model="eventPrecision" data-testid="timeline-event-precision" :disabled="props.pending">
                    <option value="exact">{{ t('reconstruction.timeline.precision.exact') }}</option>
                    <option value="approximate">{{ t('reconstruction.timeline.precision.approximate') }}</option>
                    <option value="unknown">{{ t('reconstruction.timeline.precision.unknown') }}</option>
                  </select>
                </label>
                <button
                  class="secondary-action"
                  data-testid="timeline-add-event"
                  type="button"
                  :disabled="props.pending || !eventLabel.trim() || !eventStatementId"
                  @click="addEvent"
                >
                  {{ t('reconstruction.timeline.add_event') }}
                </button>
              </div>

              <ol v-if="events.length" class="timeline-events" data-testid="timeline-events">
                <li v-for="event in events" :key="event.id">
                  <strong>{{ event.label }}</strong>
                  <span>{{ event.event_time ?? t('reconstruction.timeline.time_unknown') }}</span>
                </li>
              </ol>

              <div class="anchor-grid">
                <label>
                  <span>{{ t('reconstruction.timeline.last_supported') }}</span>
                  <select v-model="lastSupported" data-testid="timeline-last-supported" :disabled="props.pending">
                    <option value="">—</option>
                    <option v-for="statement in props.statements" :key="statement.id" :value="statement.id">
                      {{ statement.original_text }}
                    </option>
                  </select>
                </label>
                <label>
                  <span>{{ t('reconstruction.timeline.first_missing') }}</span>
                  <select v-model="firstMissing" data-testid="timeline-first-missing" :disabled="props.pending">
                    <option value="">—</option>
                    <option v-for="statement in props.statements" :key="statement.id" :value="statement.id">
                      {{ statement.original_text }}
                    </option>
                  </select>
                </label>
              </div>

              <button class="primary-action" data-testid="timeline-rebuild" type="button" :disabled="props.pending" @click="rebuild">
                {{ t('reconstruction.timeline.rebuild') }}
              </button>
            </section>
          </template>

          <style scoped>
          .reconstruction-card {
            display: grid;
            gap: 1rem;
            padding: 1.25rem;
            border: 1px solid var(--line);
            border-radius: 1rem;
            background: var(--panel);
          }
          .reconstruction-card__heading { display: flex; gap: .75rem; align-items: flex-start; }
          .reconstruction-card__heading h2,
          .reconstruction-card__heading p,
          .muted { margin: 0; }
          .reconstruction-card__icon {
            display: inline-grid;
            place-items: center;
            min-width: 2rem;
            height: 2rem;
            border: 1px solid var(--line);
            border-radius: 999px;
            font-weight: 800;
          }
          .timeline-form,
          .anchor-grid { display: grid; gap: .8rem; }
          label { display: grid; gap: .35rem; font-weight: 700; }
          input, select { width: 100%; box-sizing: border-box; }
          .timeline-events { display: grid; gap: .5rem; margin: 0; padding-left: 1.3rem; }
          .timeline-events li { display: grid; gap: .15rem; }
          .timeline-events span { color: var(--muted); }
          @media (min-width: 720px) {
            .timeline-form { grid-template-columns: 1.3fr 1.5fr 1fr 1fr; align-items: end; }
            .timeline-form .secondary-action { grid-column: 1 / -1; justify-self: start; }
            .anchor-grid { grid-template-columns: 1fr 1fr; }
          }
          </style>
          ''', encoding='utf-8')

          (components / 'TimelineSummary.vue').write_text(r'''<script setup lang="ts">
