name: Offline Task 10 bootstrap

on:
  push:
    branches: [feature/offline-execution-0.3.0]

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Narrow conformance oracle values without type ignores
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('plugins/mind-detective/scripts/conformance_vectors.py')
          text = path.read_text(encoding='utf-8')
          old = '''    elif operation == "command":\n        case = input_value["case"]\n        command = input_value["command"]\n        if not isinstance(case, dict) or not isinstance(command, dict):\n            raise AssertionError("command vector shape")\n        expected = _capture(lambda: apply_command(case, command))\n'''
          new = '''    elif operation == "command":\n        raw_case = input_value["case"]\n        raw_command = input_value["command"]\n        if not isinstance(raw_case, dict) or not isinstance(raw_command, dict):\n            raise AssertionError("command vector shape")\n        case: dict[str, object] = {}\n        for key, value in raw_case.items():\n            if not isinstance(key, str):\n                raise AssertionError("command case keys must be strings")\n            case[key] = value\n        command: dict[str, object] = {}\n        for key, value in raw_command.items():\n            if not isinstance(key, str):\n                raise AssertionError("command envelope keys must be strings")\n            command[key] = value\n        expected = _capture(lambda: apply_command(case, command))\n'''
          if old not in text:
              raise SystemExit('expected conformance oracle snippet not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Regenerate certified artifacts
        run: python -m scripts.write_local_execution_artifacts
      - name: Commit source narrowing and exact generated bytes
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/offline-task10-bootstrap.yml
          git add \
            plugins/mind-detective/scripts/conformance_vectors.py \
            apps/web/app/generated/localExecution.ts \
            apps/web/app/generated/localExecution.meta.json \
            .github/workflows/offline-task10-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m "fix: certify generated executor scope and identifiers"
          git push origin HEAD:feature/offline-execution-0.3.0
